# example playbook for module 'irmc_cas'
# to manage iRMC CAS settings

# variables not defined in this playbook are expected to be provided
# elsewhere, e.g. in group_vars/all

- name: Usage examples for irmc_cas
  connection: local
  hosts: iRMC_group

  # vars:
  #   # iRMC login credentials
  #   irmc_user: "<username>"
  #   irmc_password: "<password>"
  #   # Note: set validate_certificate to false for self-signed certificate
  #   validate_certificate: false

  gather_facts: false

  tasks:
    # Get CAS data
    - name: Get CAS data
      fsas.primergy.irmc_cas:
        irmc_url: "{{ inventory_hostname }}"
        irmc_username: "{{ irmc_user }}"
        irmc_password: "{{ irmc_password }}"
        validate_certs: "{{ validate_certificate }}"
        command: "get"
      register: cas
      delegate_to: localhost
    - name: Show iRMC CAS data
      ansible.builtin.debug:
        msg: "{{ cas.cas }}"

    # Set CAS data
    - name: Set CAS data
      fsas.primergy.irmc_cas:
        irmc_url: "{{ inventory_hostname }}"
        irmc_username: "{{ irmc_user }}"
        irmc_password: "{{ irmc_password }}"
        validate_certs: "{{ validate_certificate }}"
        command: "set"
        cas_user: "username"
        cas_password: "password"
      delegate_to: localhost

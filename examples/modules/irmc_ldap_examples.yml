# example playbook for module 'irmc_ldap'
# to manage iRMC LDAP settings

# variables not defined in this playbook are expected to be provided
# elsewhere, e.g. in group_vars/all

- name: Usage examples for irmc_ldap
  connection: local
  hosts: iRMC_group

  # vars:
  #   # iRMC login credentials
  #   irmc_user: "<username>"
  #   irmc_password: "<password>"
  #   # Note: set validate_certificate to false for self-signed certificate
  #   validate_certificate: false
  #   # LDAP authentication credentials
  #   ldap_user: "<ldap_username>"
  #   ldap_password: "<ldap_password>"

  gather_facts: false

  tasks:
    # Get LDAP data
    - name: Get and show LDAP data
      tags:
        - get
      block:
        - name: Get LDAP data
          fsas.primergy.irmc_ldap:
            irmc_url: "{{ inventory_hostname }}"
            irmc_username: "{{ irmc_user }}"
            irmc_password: "{{ irmc_password }}"
            validate_certs: "{{ validate_certificate }}"
            command: "get"
          register: ldap
          delegate_to: localhost
        - name: Show iRMC LDAP data
          ansible.builtin.debug:
            msg: "{{ ldap.ldap }}"

    # Set LDAP data
    - name: Set LDAP data
      fsas.primergy.irmc_ldap:
        irmc_url: "{{ inventory_hostname }}"
        irmc_username: "{{ irmc_user }}"
        irmc_password: "{{ irmc_password }}"
        validate_certs: "{{ validate_certificate }}"
        command: "set"
        ldap_user: "{{ ldap_user }}"
        ldap_password: "{{ ldap_password }}"
      delegate_to: localhost
      tags:
        - set

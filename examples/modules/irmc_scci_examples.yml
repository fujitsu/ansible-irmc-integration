# example playbook for module 'irmc_scci'
# to execute iRMC remote SCCI commands

# variables not defined in this playbook are expected to be provided
# elsewhere, e.g. in group_vars/all

- name: Usage examples for irmc_scci
  connection: local
  hosts: iRMC_group

  # vars:
  #   # iRMC login credentials
  #   irmc_user: "<username>"
  #   irmc_password: "<password>"
  #   # Note: set validate_certificate to false for self-signed certificate
  #   validate_certificate: false

  gather_facts: false

  tasks:
    # Write server location
    - name: Write server location
      fsas.primergy.irmc_scci:
        irmc_url: "{{ inventory_hostname }}"
        irmc_username: "{{ irmc_user }}"
        irmc_password: "{{ irmc_password }}"
        validate_certs: "{{ validate_certificate }}"
        command: "set_cs"
        opcodeext: 0x200
        data: "{{ server_location | default('In a galaxy far, far away ...') }}"
      delegate_to: localhost
      tags:
        - write

    # Read server location
    - name: Read and show server location
      tags:
        - read
      block:
        - name: "Read server location"
          fsas.primergy.irmc_scci:
            irmc_url: "{{ inventory_hostname }}"
            irmc_username: "{{ irmc_user }}"
            irmc_password: "{{ irmc_password }}"
            validate_certs: "{{ validate_certificate }}"
            command: "get_cs"
            opcodeext: 0x200
          register: read_result
          delegate_to: localhost
        - name: Show server location
          ansible.builtin.debug:
            var: read_result.data

    # Power on the server
    - name: "Power on the server"
      fsas.primergy.irmc_scci:
        irmc_url: "{{ inventory_hostname }}"
        irmc_username: "{{ irmc_user }}"
        irmc_password: "{{ irmc_password }}"
        validate_certs: "{{ validate_certificate }}"
        command: "power_on"
        opcodeext: 0x200
      delegate_to: localhost
      tags:
        - poweron

    # Power off the server
    - name: "Power off the server"
      fsas.primergy.irmc_scci:
        irmc_url: "{{ inventory_hostname }}"
        irmc_username: "{{ irmc_user }}"
        irmc_password: "{{ irmc_password }}"
        validate_certs: "{{ validate_certificate }}"
        command: "power_off"
        opcodeext: 0x200
      delegate_to: localhost
      tags:
        - poweroff

    # Cancel shutdown
    - name: "Cancel shutdown"
      fsas.primergy.irmc_scci:
        irmc_url: "{{ inventory_hostname }}"
        irmc_username: "{{ irmc_user }}"
        irmc_password: "{{ irmc_password }}"
        validate_certs: "{{ validate_certificate }}"
        command: "cancel_shutdown"
        opcodeext: 0x200
      delegate_to: localhost
      tags:
        - cancel_shutdown

    # Reset firmware
    - name: "Reset firmware"
      fsas.primergy.irmc_scci:
        irmc_url: "{{ inventory_hostname }}"
        irmc_username: "{{ irmc_user }}"
        irmc_password: "{{ irmc_password }}"
        validate_certs: "{{ validate_certificate }}"
        command: "reset_firmware"
        opcodeext: 0x200
      delegate_to: localhost
      tags:
        - reset_firm

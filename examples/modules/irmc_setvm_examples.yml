# example playbook for module 'irmc_setvm'
# to set iRMC Virtual Media Data

# variables not defined in this playbook are expected to be provided
# elsewhere, e.g. in group_vars/all

- name: Usage examples for irmc_setvm
  connection: local
  hosts: iRMC_group

  # vars:
  #   # iRMC login credentials
  #   irmc_user: "<username>"
  #   irmc_password: "<password>"
  #   # Note: set validate_certificate to false for self-signed certificate
  #   validate_certificate: false

  gather_facts: false

  tasks:
    # Set Virtual CD
    - name: Set Virtual CD
      fsas.primergy.irmc_setvm:
        irmc_url: "{{ inventory_hostname }}"
        irmc_username: "{{ irmc_user }}"
        irmc_password: "{{ irmc_password }}"
        validate_certs: "{{ validate_certificate }}"
        share_type: "{{ share_type | default(omit) }}"
        server: "{{ server }}"
        share: "{{ share }}"
        image: "{{ image }}"
        vm_domain: "{{ vm_domain | default(omit) }}"
        vm_user: "{{ vm_user | default(omit) }}"
        vm_password: "{{ vm_password | default(omit) }}"
        vm_type: "CDImage"
      delegate_to: localhost
      tags:
        - setcd

    # Set Virtual HD
    - name: Set Virtual HD
      fsas.primergy.irmc_setvm:
        irmc_url: "{{ inventory_hostname }}"
        irmc_username: "{{ irmc_user }}"
        irmc_password: "{{ irmc_password }}"
        validate_certs: "{{ validate_certificate }}"
        share_type: "{{ share_type | default(omit) }}"
        server: "{{ server }}"
        share: "{{ share }}"
        image: "{{ image }}"
        vm_domain: "{{ vm_domain | default(omit) }}"
        vm_user: "{{ vm_user | default(omit) }}"
        vm_password: "{{ vm_password | default(omit) }}"
        vm_type: "HDImage"
      delegate_to: localhost
      tags:
        - sethd

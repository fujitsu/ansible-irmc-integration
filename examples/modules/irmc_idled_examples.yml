# example playbook for module 'irmc_idled'
# to get or set server ID LED

# variables not defined in this playbook are expected to be provided
# elsewhere, e.g. in group_vars/all

# Usage examples:
# ansible-playbook irmc_idled_examples.yml --tags get           # Get current LED state
# ansible-playbook irmc_idled_examples.yml --tags set           # Set LED to Lit (default)
# ansible-playbook irmc_idled_examples.yml --tags set -e state=Off       # Turn LED off
# ansible-playbook irmc_idled_examples.yml --tags set -e state=Blinking  # Set LED to blink

- name: Usage examples for irmc_idled
  connection: local
  hosts: iRMC_group

  # vars:
  #   # iRMC login credentials
  #   irmc_user: "<username>"
  #   irmc_password: "<password>"
  #   # Note: set validate_certificate to false for self-signed certificate
  #   validate_certificate: false

    # LED state configuration (default: Lit if not specified)
    # state: "Lit"    # choices: "Off", "Lit", "Blinking"

  gather_facts: false

  tasks:
    # Get server ID LED state
    - name: Get and show server ID LED state
      tags:
        - get
      block:
        - name: Get ID LED state
          fsas.primergy.irmc_idled:
            irmc_url: "{{ inventory_hostname }}"
            irmc_username: "{{ irmc_user }}"
            irmc_password: "{{ irmc_password }}"
            validate_certs: "{{ validate_certificate }}"
            command: "get"
          register: idled
          delegate_to: localhost
        - name: Show iRMC ID LED state
          ansible.builtin.debug:
            var: idled.idled_state

    # Set server ID LED state
    - name: Set server ID LED state
      fsas.primergy.irmc_idled:
        irmc_url: "{{ inventory_hostname }}"
        irmc_username: "{{ irmc_user }}"
        irmc_password: "{{ irmc_password }}"
        validate_certs: "{{ validate_certificate }}"
        command: "set"
        state: "{{ state | default('Lit') }}"
      delegate_to: localhost
      tags:
        - set
